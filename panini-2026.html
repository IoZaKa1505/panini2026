<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panini FIFA World Cup 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a1a;color:#fff;min-height:100vh}
#header{background:linear-gradient(135deg,#1a1a3e,#0d0d2b);border-bottom:2px solid #c8a400;padding:14px 16px}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.header-top h1{font-size:17px;font-weight:700;color:#ffd700}
.header-top p{font-size:11px;color:#aaa}
.progress-box{background:#111;border-radius:8px;padding:10px;border:1px solid #333}
.progress-nums{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog-bar{background:#2a2a4a;border-radius:4px;height:8px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#4ade80,#22c55e);height:100%;transition:width .3s}
.prog-label{text-align:center;font-size:11px;color:#888;margin-top:5px}
#tabs{display:flex;background:#111;border-bottom:1px solid #333;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:10px 2px;background:transparent;border:none;border-bottom:2px solid transparent;color:#888;cursor:pointer;font-size:10px;font-weight:500}
.tab.active{background:#1a1a3e;border-bottom-color:#ffd700;color:#ffd700;font-weight:700}
#content{padding:10px}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters input{flex:1;min-width:100px;padding:8px 10px;background:#1a1a3e;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px}
.filters select{padding:8px 6px;background:#1a1a3e;border:1px solid #333;border-radius:8px;color:#fff;font-size:12px;max-width:160px}
.sticker-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:5px;border:1px solid #2a2a4a;background:#1a1a2e}
.sticker-row.owned{background:#0d2b1a;border-color:#1a5c30}
.check-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:14px;flex-shrink:0;background:#2a2a4a;color:#666}
.check-btn.owned{background:#22c55e;color:#fff}
.sticker-info{flex:1;min-width:0}
.sticker-id{font-size:11px;color:#ffd700;font-weight:700}
.sticker-name{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker-row.owned .sticker-name{color:#fff}
.sticker-team{font-size:10px;color:#555}
.doubles-ctrl{display:flex;align-items:center;gap:3px;flex-shrink:0}
.d-btn{width:22px;height:22px;background:#2a2a4a;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:14px;line-height:1}
.d-num{font-size:13px;min-width:16px;text-align:center;color:#555}
.d-num.has{color:#f97316}
.missing-info{padding:10px;background:#1a1a2e;border-radius:8px;border:1px solid #333;font-size:13px;color:#aaa;margin-bottom:10px}
.team-section{margin-bottom:12px}
.team-title{font-size:13px;font-weight:700;color:#ffd700;margin-bottom:6px;padding:4px 0;border-bottom:1px solid #333}
.tag-grid{display:flex;flex-wrap:wrap;gap:4px}
.miss-tag{padding:4px 7px;background:#2a1a1a;border:1px solid #5c1a1a;border-radius:6px;color:#f87171;font-size:11px;cursor:pointer}
.double-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a1500;border-radius:8px;border:1px solid #3d2e00;margin-bottom:6px}
.double-info{flex:1}
.double-id{font-size:12px;color:#ffd700;font-weight:700}
.double-name{font-size:13px;color:#fff}
.double-team{font-size:11px;color:#888}
.d-ctrl{display:flex;align-items:center;gap:4px}
.d-ctrl button{width:24px;height:24px;background:#3d2e00;border:none;border-radius:4px;color:#fff;cursor:pointer}
.d-count{color:#f97316;font-weight:700;min-width:24px;text-align:center}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:#1a1a2e;border-radius:10px;padding:14px;border:1px solid #333;text-align:center}
.stat-val{font-size:26px;font-weight:700}
.stat-lbl{font-size:12px;color:#888;margin-top:2px}
.team-bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.team-bar-bg{background:#2a2a4a;border-radius:3px;height:6px;margin-bottom:7px}
.team-bar-fill{background:linear-gradient(90deg,#3b82f6,#6366f1);height:100%;border-radius:3px;transition:width .3s}
.team-bar-fill.full{background:#4ade80}
.empty{text-align:center;padding:30px;color:#888}
.complete{text-align:center;padding:30px;color:#4ade80;font-size:22px}
</style>
</head>

    </div>

</div>

  <button class="tab" onclick="showTab('doubles')" id="tab-doubles">🔄 Doubles</button>

</div>

const TEAMS=[...new Set(STICKERS.map(s=>s.team))];
const KEY="panini2026";
let state={owned:{},doubles:{}};

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s)state=JSON.parse(s);}catch(e){}}

load();
updateHeader();

let currentTab="collection";

function showTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach((t,i)=>{
    t.classList.toggle("active",["collection","manquants","doubles","stats"][i]===tab);
  });
  render();
}

function toggleOwned(id){
  if(state.owned[id]){delete state.owned[id];delete state.doubles[id];}
  else state.owned[id]=true;
  save();updateHeader();render();
}

function setDoubles(id,n){
  if(n<=0)delete state.doubles[id];else state.doubles[id]=n;
  save();updateHeader();render();
}

function updateHeader(){
  const owned=Object.keys(state.owned).length;
  const total=STICKERS.length;
  const missing=total-owned;
  const pct=Math.round(owned/total*100);
  const doubles=Object.values(state.doubles).reduce((a,b)=>a+b,0);
  document.getElementById("ownedCount").textContent=owned;
  document.getElementById("ownedCount2").textContent=owned;
  document.getElementById("missingCount").textContent=missing;
  document.getElementById("pct").textContent=pct;
  document.getElementById("totalCount").textContent=total;
  document.getElementById("doublesCount").textContent=doubles;
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("tab-manquants").textContent="❌ Manquants ("+missing+")";
  document.getElementById("tab-doubles").textContent="🔄 Doubles ("+doubles+")";
}

function getFilters(){
  const search=(document.getElementById("search")||{value:""}).value.toLowerCase();
  const team=(document.getElementById("teamFilter")||{value:"Tous"}).value;
  return{search,team};
}

function render(){
  const c=document.getElementById("content");
  if(currentTab==="collection") renderCollection(c);
  else if(currentTab==="manquants") renderManquants(c);
  else if(currentTab==="doubles") renderDoubles(c);
  else renderStats(c);
}

function renderCollection(c){
  const {search,team}=getFilters();
  const filtered=STICKERS.filter(s=>{
    const tm=team==="Tous"||s.team===team;
    const sm=!search||s.name.toLowerCase().includes(search)||s.id.toLowerCase().includes(search);
    return tm&&sm;
  });
  let html=`<div class="filters">
    <input id="search" placeholder="🔍 Rechercher..." oninput="render()" value="${(document.getElementById("search")||{value:""}).value}">
    <select id="teamFilter" onchange="render()">
      <option value="Tous">Toutes les équipes</option>
      ${TEAMS.map(t=>`<option value="${t}" ${team===t?"selected":""}>${t}</option>`).join("")}
    </select>
  </div>`;
  html+=filtered.map(s=>{
    const owned=!!state.owned[s.id];
    const d=state.doubles[s.id]||0;
    return `<div class="sticker-row ${owned?"owned":""}">
      <button class="check-btn ${owned?"owned":""}" onclick="toggleOwned('${s.id}')">${owned?"✓":"○"}</button>
      <div class="sticker-info">
        <div class="sticker-id">${s.id}${s.foil?" ⭐":""}</div>
        <div class="sticker-name">${s.name}</div>
        <div class="sticker-team">${s.team}</div>
      </div>
      ${owned?`<div class="doubles-ctrl">
        <button class="d-btn" onclick="setDoubles('${s.id}',${d-1})">−</button>
        <span class="d-num ${d>0?"has":""}">${d}</span>
        <button class="d-btn" onclick="setDoubles('${s.id}',${d+1})">+</button>
      </div>`:""}
    </div>`;
  }).join("");
  c.innerHTML=html;
}

function renderManquants(c){
  const missing=STICKERS.filter(s=>!state.owned[s.id]);
  let html=`<div class="missing-info">Il vous manque <strong style="color:#f87171">${missing.length} stickers</strong> sur ${STICKERS.length}.</div>`;
  if(missing.length===0){html+='<div class="complete">🎉 Collection complète !</div>';}
  else{
    TEAMS.filter(t=>missing.some(s=>s.team===t)).forEach(t=>{
      const tm=missing.filter(s=>s.team===t);
      html+=`<div class="team-section">
        <div class="team-title">${t} (${tm.length} manquants)</div>
        <div class="tag-grid">${tm.map(s=>`<button class="miss-tag" onclick="toggleOwned('${s.id}')">${s.id}${s.foil?" ⭐":""}</button>`).join("")}</div>
      </div>`;
    });
  }
  c.innerHTML=html;
}

function renderDoubles(c){
  const dl=STICKERS.filter(s=>state.doubles[s.id]>0);
  const total=Object.values(state.doubles).reduce((a,b)=>a+b,0);
  let html=`<div class="missing-info">Vous avez <strong style="color:#f97316">${total} doubles</strong> à échanger.</div>`;
  if(dl.length===0) html+='<div class="empty">Aucun double pour l instant</div>';
  else html+=dl.map(s=>`<div class="double-row">
    <div class="double-info">
      <span class="double-id">${s.id} </span>
      <span class="double-name">${s.name}</span>
      <div class="double-team">${s.team}</div>
    </div>
    <div class="d-ctrl">
      <button onclick="setDoubles('${s.id}',${(state.doubles[s.id]||0)-1})">−</button>
      <span class="d-count">×${state.doubles[s.id]}</span>
      <button onclick="setDoubles('${s.id}',${(state.doubles[s.id]||0)+1})">+</button>
    </div>
  </div>`).join("");
  c.innerHTML=html;
}

function renderStats(c){
  const owned=Object.keys(state.owned).length;
  const total=STICKERS.length;
  const missing=total-owned;
  const doubles=Object.values(state.doubles).reduce((a,b)=>a+b,0);
  const pct=Math.round(owned/total*100);
  let html=`<div class="stats-grid">
    ${[["Possédés",owned,"#4ade80"],["Manquants",missing,"#f87171"],["Doubles",doubles,"#f97316"],["Progression",pct+"%","#ffd700"]]
      .map(([l,v,col])=>`<div class="stat-card"><div class="stat-val" style="color:${col}">${v}</div><div class="stat-lbl">${l}</div></div>`).join("")}
  </div>
  <div style="font-size:13px;font-weight:700;color:#ffd700;margin-bottom:10px">Progression par équipe</div>`;
  html+=TEAMS.map(t=>{
    const ts=STICKERS.filter(s=>s.team===t);
    const ow=ts.filter(s=>state.owned[s.id]).length;
    const p=Math.round(ow/ts.length*100);
    return `<div class="team-bar-lbl"><span style="color:#ccc">${t}</span><span style="color:${p===100?"#4ade80":"#888"}">${ow}/${ts.length}</span></div>
    <div class="team-bar-bg"><div class="team-bar-fill ${p===100?"full":""}" style="width:${p}%"></div></div>`;
  }).join("");
  c.innerHTML=html;
}

render();
</script>
